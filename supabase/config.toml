project_id = "unfold"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:8765"
additional_redirect_urls = ["http://127.0.0.1:43821/auth/callback"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false

[auth.external.google]
enabled = false
client_id = ""
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false

[functions.get-entitlement]
verify_jwt = true

[functions.create-checkout]
verify_jwt = true

# Lemon Squeezy authenticates with HMAC, not a Supabase user JWT.
[functions.lemon-webhook]
verify_jwt = false
