<!doctype html>
<html lang="ko" data-theme="oat">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unfold · 로그인과 구매 화면 시안</title>
  <link rel="stylesheet" href="../styles/main.css">
  <link rel="stylesheet" href="account.css">
  <script src="account.js" defer></script>
</head>
<body>
  <header class="review-bar">
    <div><strong>Unfold · 계정 화면 시안</strong><p>실제 로그인과 결제는 진행되지 않습니다.</p></div>
    <div class="review-controls">
      <label>상태<select id="state"><option value="login">로그인</option><option value="auth">브라우저 인증 중</option><option value="purchase">구매</option><option value="pending">결제 확인 중</option><option value="ready">구매 완료</option><option value="error">연결 오류</option></select></label>
      <label>가격<select id="market"><option value="KR">국내 · 4,900원</option><option value="GLOBAL">해외 · US$3.99</option></select></label>
      <label>테마<select id="theme"><option value="oat">다정한 오트</option><option value="sage">숨 고르는 숲</option><option value="midnight">밤의 버터</option><option value="plum">유연한 라일락</option></select></label>
      <label>창 크기<select id="size"><option value="default">기본</option><option value="compact">최소</option></select></label>
    </div>
  </header>
  <main class="preview-stage">
    <section class="app-frame" aria-label="앱 최초 실행 화면">
      <header class="app-header"><span class="wordmark">unfold<span aria-hidden="true">✳</span></span><span class="account-chip" id="account" hidden>demo@example.test</span></header>
      <div class="app-content">
        <div class="pet-scene" aria-hidden="true"><img src="../assets/pet-stretch.webp" alt="" width="240" height="240"><span class="pet-caption">잠깐 쉬어 가요.</span></div>
        <section class="access-card" aria-labelledby="screen-title">
          <span class="small-brand">UNFOLD</span>
          <h1 id="screen-title">반가워요</h1>
          <p class="purchase-price" id="price" hidden><strong id="amount">4,900원</strong><span>1회 구매</span></p>
          <p class="state-label" id="status" role="status" hidden></p>
          <div class="screen-actions">
            <button class="btn btn-primary btn-block" id="primary" type="button">Google로 계속하기</button>
            <button class="btn btn-secondary btn-block" id="secondary" type="button" hidden>다른 계정으로 로그인</button>
          </div>
          <p class="price-foot" id="price-foot">국내 4,900원 · 해외 US$3.99</p>
          <footer class="legal-links"><a href="../pricing.html" target="_blank" rel="noopener">구매 안내</a><span aria-hidden="true">·</span><a href="../privacy.html" target="_blank" rel="noopener">개인정보</a></footer>
        </section>
      </div>
      <footer class="app-footer"><span>macOS · Windows</span><span id="step">01 / 로그인</span></footer>
    </section>
  </main>
</body>
</html>
