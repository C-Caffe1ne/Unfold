name: C# desktop
env:
  AVALONIA_TELEMETRY_OPTOUT: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Unfold.slnx --locked-mode
      - run: dotnet test Unfold.slnx -c Release --no-restore
      - name: Publish Windows portable app
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./Scripts/publish-desktop.ps1 -Runtime win-x64
      - name: Bundle macOS app
        if: runner.os == 'macOS'
        run: bash Scripts/make-macos-bundle.sh ${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: Unfold-${{ matrix.rid }}
          path: |
            artifacts/Unfold-*.zip
            artifacts/Unfold-*.tar.gz
