name: C# desktop
env:
  AVALONIA_TELEMETRY_OPTOUT: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Unfold.slnx --locked-mode
      - run: dotnet tool restore
      - name: Prepare MP4 import tools
        run: dotnet run --project tools/Unfold.MediaSetup -- ${{ matrix.rid }} "${{ github.workspace }}"
      - run: dotnet test Unfold.slnx -c Release --no-restore
      - name: Publish Windows portable app
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./Scripts/publish-desktop.ps1 -Runtime win-x64
      - name: Build updater-enabled Windows installer and release feed
        if: runner.os == 'Windows'
        run: python Scripts/package-updates.py --runtime win-x64
      - name: Verify Windows install and uninstall with preserved user data
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./Scripts/verify-windows-installer.ps1
      - name: Prepare Windows CI display for native layout checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./Scripts/prepare-windows-ci-display.ps1
      - name: Run packaged Windows smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:UNFOLD_DATA_DIR = Join-Path $env:RUNNER_TEMP ('unfold-smoke-' + [guid]::NewGuid().ToString('N'))
          "UNFOLD_SMOKE_DIR=$env:UNFOLD_DATA_DIR" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $version = [regex]::Match((Get-Content -Raw './src/Unfold.Desktop/Unfold.Desktop.csproj'), '<Version>([^<]+)</Version>').Groups[1].Value
          $portable = Join-Path $env:RUNNER_TEMP ('Unfold-portable-' + [guid]::NewGuid().ToString('N'))
          Expand-Archive -LiteralPath "./artifacts/Unfold-v$version-win-x64.zip" -DestinationPath $portable
          $process = Start-Process -FilePath (Join-Path $portable 'Unfold.exe') -ArgumentList '--smoke-test' -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(120000)) {
            $process.Kill()
            throw 'Smoke test did not exit within 120 seconds.'
          }
          $process.Refresh()
          $resultPath = Join-Path $env:UNFOLD_DATA_DIR 'verification/smoke.json'
          if (-not (Test-Path $resultPath)) { throw 'smoke.json was not produced.' }
          $result = Get-Content -Raw $resultPath | ConvertFrom-Json
          Write-Output "Smoke test exit code: $($process.ExitCode)"
          Write-Output ($result | ConvertTo-Json)
          if ($process.ExitCode -ne 0 -or -not $result.success) { throw 'Packaged smoke test reported failure.' }
      - name: Bundle macOS app
        if: runner.os == 'macOS'
        run: bash Scripts/make-macos-bundle.sh ${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: Unfold-${{ matrix.rid }}
          path: |
            artifacts/Unfold-*.zip
            artifacts/Unfold-*.tar.gz
            artifacts/Unfold-*.dmg
            artifacts/Unfold-*-setup.exe
            artifacts/update-releases/${{ matrix.rid }}/*.nupkg
            artifacts/update-releases/${{ matrix.rid }}/releases.*.json
      - name: Upload Windows installer verification
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Unfold-win-x64-installer-verification
          path: artifacts/validation/windows-installer
          if-no-files-found: ignore
      - name: Upload Windows smoke verification
        if: always() && runner.os == 'Windows' && env.UNFOLD_SMOKE_DIR != ''
        uses: actions/upload-artifact@v4
        with:
          name: Unfold-win-x64-smoke
          path: |
            ${{ env.UNFOLD_SMOKE_DIR }}/verification
            ${{ env.UNFOLD_SMOKE_DIR }}/unfold.log
          if-no-files-found: ignore
