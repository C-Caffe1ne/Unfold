        - generic [ref=f1e240]:
          - generic [ref=f1e241]:
            - heading "구매하면 무엇을 받나요?" [level=3] [ref=f1e242]
            - paragraph [ref=f1e243]: Windows·macOS 설치 파일을 내려받아 내 컴퓨터에 설치합니다. 설치형 데스크톱 앱이며 별도로 제공하는 서비스나 작업은 없습니다. 한 번 구매하면 계속 사용합니다. 타이머·펫·휴식 기록은 모두 내 컴퓨터에서 동작합니다.
          - generic [ref=f1e244]:
            - heading "다시 설치하면 또 구매해야 하나요?" [level=3] [ref=f1e245]
            - paragraph [ref=f1e246]: 앱과 웹에서 같은 Google 계정으로 로그인하면 서버에 저장된 이용 권한을 확인합니다. 휴식 기록과 펫 파일의 클라우드 동기화는 제공하지 않습니다.
          - generic [ref=f1e247]:
            - heading "인터넷 없이도 쓸 수 있나요?" [level=3] [ref=f1e248]
            - paragraph [ref=f1e249]: 현재는 앱을 켤 때마다 Google 계정으로 로그인해 구매 권한을 확인합니다. 오프라인 사용은 아직 제공하지 않습니다. 확인이 끝나면 타이머·펫·휴식 기록은 모두 내 컴퓨터에서 동작하며, 기록과 펫 파일은 서버로 올라가지 않습니다.
          - generic [ref=f1e250]:
            - heading "회사 컴퓨터에서도 쓸 수 있나요?" [level=3] [ref=f1e251]
            - paragraph [ref=f1e252]: 별도의 게임 클라이언트 없이 설치할 수 있습니다. 회사 컴퓨터에서는 사내 소프트웨어 설치 정책을 먼저 확인해 주세요.
