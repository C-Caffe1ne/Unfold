        - heading "다운로드는 무료, 사용은 한 번의 구매" [active] [level=1] [ref=f1e225]
        - paragraph [ref=f1e226]: Unfold는 내 컴퓨터에 설치해 사용하는 데스크톱 애플리케이션입니다. 구독이 아니라 국내 4,900원(세금 별도)의 일회성 구매이며, 구매하면 Windows·macOS 설치 파일을 내려받아 사용합니다. 무료 체험은 없습니다.
